{% load static %}
<header class="site-header" id="site-header">
  <a class="brand" href="{% url 'inicio' %}" aria-label="LibrAI — página inicial"><img class="brand-logo"
      src="{% static 'img/logo.png' %}" alt=""><span class="brand-name">LibrAI</span></a>
  <nav class="header-nav" aria-label="Navegação principal"><a href="{% url 'inicio' %}#projeto">O projeto</a><a
      href="{% url 'inicio' %}#como-funciona">Como funciona</a><a href="{% url 'inicio' %}#impacto">Impacto</a><a
      href="{% url 'inicio' %}#esg">Compromisso</a><a href="{% url 'gestos' %}">Gestos</a>
    <!-- Futuro: link "Aprender" entra nesta navegação. -->
  </nav>
  <div class="header-actions">
    <a class="header-cta" href="{% url 'reconhecer' %}">Reconhecer <span aria-hidden="true">→</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu"
      aria-label="Abrir menu"><span class="menu-bar" aria-hidden="true"></span><span class="menu-bar"
        aria-hidden="true"></span><span class="menu-bar" aria-hidden="true"></span></button>
  </div>
</header>
<nav class="mobile-menu" id="mobile-menu" aria-label="Menu">
  <a href="{% url 'inicio' %}#projeto">O projeto</a>
  <a href="{% url 'inicio' %}#como-funciona">Como funciona</a>
  <a href="{% url 'inicio' %}#impacto">Impacto</a>
  <a href="{% url 'inicio' %}#esg">Compromisso</a>
  <a href="{% url 'gestos' %}">Gestos</a>
  <a class="mobile-cta" href="{% url 'reconhecer' %}">Reconhecer</a>
  <!-- Futuro: link "Aprender" entra neste menu. -->
</nav>
<script>
  (function () {
    const header = document.getElementById('site-header');
    const toggle = header.querySelector('.menu-toggle');
    const menu = document.getElementById('mobile-menu');
    const isOpen = () => menu.classList.contains('is-open');
    function setOpen(open) {
      menu.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    }
    toggle.addEventListener('click', () => setOpen(!isOpen()));
    menu.addEventListener('click', event => { if (event.target.closest('a')) setOpen(false); });
    document.addEventListener('click', event => {
      if (isOpen() && !event.target.closest('#site-header') && !event.target.closest('#mobile-menu')) setOpen(false);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && isOpen()) { setOpen(false); toggle.focus(); }
    });
  })();
</script>
